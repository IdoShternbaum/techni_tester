[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "techni-tester"
version = "0.1.0"
description = "Build and test CMake projects from the command line"
requires-python = ">=3.9"

[project.scripts]
techni-tester = "technio_tester:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["technio_tester"]

[tool.setuptools.packages.find]
where = ["src"]
